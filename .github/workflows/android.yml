name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;27.2.12479018"

      - name: Download Stockfish source
        run: |
          git clone --depth 1 https://github.com/official-stockfish/Stockfish.git stockfish-source

      - name: Build Stockfish ARM64 for Android
        run: |
          export NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          cd stockfish-source/src

          make -j2 build ARCH=armv8 COMP=ndk

          file stockfish
          ls -lh stockfish

      - name: Add Stockfish to Android app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a

          cp stockfish-source/src/stockfish \
             app/src/main/jniLibs/arm64-v8a/libstockfish.so

          chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so

          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log

      - name: Show only important errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "================ IMPORTANT ERRORS ================"
          grep -i -E \
          "(^e:|error:|exception|unresolved reference|compilation error|failed|failure|cannot find|could not|aapt:|aapt2|resource .* not found|manifest merger)" \
          build.log | head -n 120 || true
          echo "=================================================="

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: StockfishOverlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
